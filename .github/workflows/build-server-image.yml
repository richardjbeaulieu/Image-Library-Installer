# Builds the Image Library web server as a Docker image and publishes it to GitHub's container registry,
# where the NAS downloads it from. Runs whenever the app code changes on main, or from the Actions tab.
name: Build NAS server image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'src/lib/**'
      - 'src/renderer/**'
      - 'web/**'
      - 'Dockerfile'
      - '.github/workflows/build-server-image.yml'

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/image-library:latest
            ghcr.io/${{ github.repository_owner }}/image-library:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
