# Image Library on the UGREEN NAS.
# Paste this into the UGOS Docker app (Project > Create) and adjust the two folder paths on the left of each
# "volumes" line so they match your NAS. Then open https://imagelibrary.tail688d97.ts.net in a browser
# (or http://newfileserver:8787 directly).
services:
  image-library:
    image: ghcr.io/richardjbeaulieu/image-library:latest
    container_name: image-library
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      TZ: America/Toronto
      # How the image folders look from the PCs. Used for "Copy path" and shown in the app.
      PATH_MAP: '/library=X:\ETSY'
      # Optional: require a password in the browser (any user name).
      # APP_PASSWORD: change-me
      # Optional: the Claude API key can also be saved from the app's Settings instead.
      # ANTHROPIC_API_KEY: sk-ant-...
    volumes:
      # The NAS folder that X:\ETSY points to.
      - ../../Files/ETSY:/library
      # Descriptions, albums, settings, and thumbnails. Any folder on the NAS; keep it backed up.
      - ./data:/data

  # Reverse-proxies image-library over HTTPS at a friendly, port-free tailnet address
  # (https://imagelibrary.<your-tailnet>.ts.net) instead of http://newfileserver:8787.
  # After first deploy, open Container > imagelibrary-alias > Terminal and run once:
  #   tailscale serve --bg --https=443 http://127.0.0.1:8787
  imagelibrary-alias:
    image: tailscale/tailscale:latest
    container_name: imagelibrary-alias
    restart: unless-stopped
    network_mode: host
    privileged: true
    environment:
      # Generate a new key at https://login.tailscale.com/admin/settings/keys (reusable, doesn't expire on first use).
      TS_AUTH_KEY: tskey-auth-REPLACE-WITH-YOUR-REAL-KEY
      TS_HOSTNAME: imagelibrary
      TS_STATE_DIR: /var/lib/tailscale
    volumes:
      - ./ts-lib:/var/lib/tailscale
